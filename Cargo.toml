[package]
name         = "obsidian-portable"
version      = "2.0.0"
edition      = "2021"
description  = "Portable launcher and auto-updater for Obsidian"
repository   = "https://github.com/FerNikoMF/Obsidian-Portable"
license      = "GPL-3.0"

[dependencies]
eframe      = "0.31"
reqwest     = { version = "0.13", features = ["blocking", "json"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
sevenz-rust = "0.6"
nsis        = "0.3"
mslnk       = "0.1"
pelite      = "0.10"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level     = "z"   # optimise for size
lto           = true
codegen-units = 1
strip         = true
