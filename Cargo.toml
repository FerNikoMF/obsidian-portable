[package]
name         = "obsidian-portable"
version      = "1.0.0"
edition      = "2021"
description  = "Portable launcher and auto-updater for Obsidian"
repository   = "https://github.com/FerNikoMF/Obsidian-Portable"
license      = "MIT"

[dependencies]
eframe      = "0.31"
reqwest     = { version = "0.13", features = ["blocking", "json"] }
serde       = { version = "1",    features = ["derive"] }
encoding_rs = "0.8"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level     = "z"   # optimise for size
lto           = true
codegen-units = 1
strip         = true
